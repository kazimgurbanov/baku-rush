name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Asililiqlar
        run: npm install
      - name: Android layihesi
        run: |
          npx cap add android
          npx cap sync android
      - name: Enine rejim, tam ekran ve ikon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          ST=android/app/src/main/res/values/styles.xml
          sed -i -E 's#(<style name="AppTheme.NoActionBar"[^>]*>)#\1<item name="android:windowFullscreen">true</item>#' $ST
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp res/icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp res/icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp res/icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png || true
          done
      - name: APK yig
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BakuRush.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BakuRush-APK
          path: BakuRush.apk
